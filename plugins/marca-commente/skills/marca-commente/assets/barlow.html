<!-- Duas tipografias, fronteiras fechadas — Guía de la familia commente.me v1.2.

     Barlow (Google Fonts, OFL) SÓ em logotipo, título e subtítulo — pesos 700 e 900.
     Arial em todo o texto: corpo, interface, rótulo, tabela, botão — pesos 400 e 700.
     Arial é de sistema e não carrega; por isso só a Barlow aparece aqui.

     Nunca Arial num logotipo ou título. Nunca Barlow num parágrafo ou controle. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;900&display=swap" rel="stylesheet">
